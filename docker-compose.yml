services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: otpdb
      POSTGRES_USER: otp
      POSTGRES_PASSWORD: otp
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:8
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports: ["5050:80"]
    depends_on: [postgres]
    volumes:
      - ./infra/pgadmin/servers.json:/pgadmin4/servers.json

  mailhog:
    image: mailhog/mailhog
    ports: ["1025:1025", "8025:8025"]

  java-app:
    build: .
    depends_on: [postgres, mailhog]
    environment:
      JWT_SECRET: very-secret-key-change-it-very-secret-key-change-it
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
      SMPP_EMULATOR_URL: http://smpp-emulator:8080/sms
      TELEGRAM_BOT_TOKEN: ""
    ports: ["8080:8080"]

volumes:
  pgdata:
